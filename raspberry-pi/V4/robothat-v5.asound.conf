# Robot HAT V5: PiDog speaker and microphone.
# Installed as /etc/asound.conf by the from-scratch deployment.

pcm.robothat {
    type asym
    playback.pcm {
        type plug
        slave.pcm "speaker"
    }
    capture.pcm {
        type plug
        slave.pcm "mic"
    }
}

pcm.speaker_hw {
    type hw
    card sndrpigooglevoi
    device 0
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "speaker_hw"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 44100
        channels 2
    }
}

ctl.dmixer {
    type hw
    card sndrpigooglevoi
}

pcm.speaker {
    type softvol
    slave {
        pcm "dmixer"
    }
    control {
        name "robot-hat speaker Playback Volume"
        card sndrpigooglevoi
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.mic_hw {
    type hw
    card sndrpigooglevoi
    device 0
}

pcm.mic {
    type softvol
    slave {
        pcm "mic_hw"
    }
    control {
        name "robot-hat mic Capture Volume"
        card sndrpigooglevoi
    }
    min_dB -26.0
    max_dB 25.0
}

ctl.robothat {
    type hw
    card sndrpigooglevoi
}

pcm.!default robothat
ctl.!default robothat
