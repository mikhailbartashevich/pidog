name: Post-merge checks

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    name: Web — format, lint, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting, lint, unit tests and production build
        run: yarn check

      - name: Type-check TypeScript
        run: yarn tsc --noEmit

      - name: Install Chromium for end-to-end tests
        run: yarn playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: yarn e2e

  android:
    name: Android — Java, lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile, lint and run unit tests
        run: ./gradlew --no-daemon test lint assembleDebug

  raspberry-pi:
    name: Raspberry Pi — Python syntax and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pidog-pycache
        run: python -m compileall -q raspberry_pi

      - name: Run all supported PiDog variants' tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pidog-pycache
        run: bash raspberry_pi/run_tests.sh
